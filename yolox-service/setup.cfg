[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    venv,
    .mypy_cache,
    build,
    dist,
    ./yolox-consumer/yolox/*,
    ./yolox-consumer/exps/*,
    yolox-consumer/yolox,
    yolox-consumer/exps

ignore =
    Q000,
    D100,
    D101,
    D102,
    D103,
    D104,
    D107,
    D205,
    D400,
    D401,
    I001, 
    I004

[isort]
profile = black
line_length = 100