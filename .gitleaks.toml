[extend]
useDefault = true

[baseline]
path = ".gitleaks-baseline.json"

[[allowlists]]
description = "Ignore virtual environments and baseline file"
paths = [
    '''venv/''',
    '''\.venv/''',
    '''node_modules/''',
    '''.gitleaks-baseline.json'''
]

[[allowlists]]
description = "OpenCV API constants are not API keys"
regexes = [
    '''api\.CV_'''
]